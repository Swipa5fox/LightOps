name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'app/__init__.py'
      - 'CHANGELOG.md'
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 确定发布版本与文件
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' app/__init__.py)
          test -n "$version"
          tag="v${version}"
          archive="releases/LightOps-${version}-integrated.tar.gz"
          test -f "$archive"
          test -f releases/SHA256SUMS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: 校验发布包 SHA-256
        working-directory: releases
        run: sha256sum -c SHA256SUMS

      - name: 提取当前版本说明
        shell: bash
        run: |
          awk '/^## 历史版本/{exit} {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: 创建或更新正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          archive="${{ steps.release.outputs.archive }}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag -a "$tag" -m "LightOps ${version}"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "LightOps ${version}" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$tag" \
              "$archive" \
              releases/SHA256SUMS \
              --clobber
          else
            gh release create "$tag" \
              "$archive" \
              releases/SHA256SUMS \
              --verify-tag \
              --title "LightOps ${version}" \
              --notes-file release-notes.md \
              --latest
          fi
