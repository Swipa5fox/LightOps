name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.4.1，须与 app/__init__.py 的 __version__ 一致）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 确定发布版本
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ inputs.version }}"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=releases/LightOps-${version}-integrated.tar.gz" >> "$GITHUB_OUTPUT"

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 构建发布包
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/build-release.py --output "${{ steps.release.outputs.archive }}"
          cd releases
          sha256sum "LightOps-${{ steps.release.outputs.version }}-integrated.tar.gz" > SHA256SUMS

      - name: 校验发布包 SHA-256
        working-directory: releases
        run: sha256sum -c SHA256SUMS

      - name: 提取当前版本说明
        shell: bash
        run: |
          awk 'BEGIN{n=0} /^# 🎉 版本/{n++} n==1{print} n==2{exit}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: 创建正式 Release 并上传文件
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          verify_flag=""
          if [ "${{ github.event_name }}" = "push" ]; then
            verify_flag="--verify-tag"
          fi
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.archive }}" \
            releases/SHA256SUMS \
            $verify_flag \
            --title "LightOps ${{ steps.release.outputs.version }}" \
            --notes-file release-notes.md \
            --latest
