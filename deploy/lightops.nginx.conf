server {
    listen __LIGHTOPS_PUBLIC_PORT__;
    listen [::]:__LIGHTOPS_PUBLIC_PORT__;
    server_name __LIGHTOPS_SERVER_NAME__;

    # ---- 隐藏 Nginx 版本号 ----
    # 关闭后，错误页与响应头 Server 不再携带版本信息，减小信息泄露面。
    server_tokens off;

    access_log /var/log/nginx/lightops_access.log;
    error_log /var/log/nginx/lightops_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # ---- 静态资源压缩（Gzip）----
    # 反向代理层对文本类响应启用压缩，减少 JS/CSS/HTML/SVG/JSON 体积。
    # 已压缩格式（woff2/png 等）不在名单内，避免无谓的二次压缩。
    gzip on;
    gzip_vary on;               # 响应头带 Vary: Accept-Encoding，避免中间代理缓存错乱
    gzip_comp_level 5;          # 压缩比与 CPU 开销的平衡点
    gzip_min_length 1024;       # 小于 1KB 不压（收益低、开销高）
    gzip_http_version 1.1;      # 只对 HTTP/1.1+ 客户端压缩
    gzip_proxied any;           # 对经 proxy_pass 转发的响应也压缩
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 自定义错误页 ----
    # 404：未知路径返回自定义页；500/502/503/504：后端异常或不可达时返回。
    # 页面为自包含 HTML（内联样式），即使主 CSS/JS 加载失败也能正常展示。
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        root /opt/lightops/app/static;
        internal;
    }

    location = /500.html {
        root /opt/lightops/app/static;
        internal;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /vendor/ {
        root /opt/lightops/app/static;
        expires 30d;
    }

    location = /index.html {
        root /opt/lightops/app/static;
        expires -1;
    }

    location ~ ^/(app\.js|render\.js|style\.css)$ {
        root /opt/lightops/app/static;
        expires -1;
    }

    location / {
        root /opt/lightops/app/static;
        # 未匹配的静态路径返回真实 404，由自定义 /404.html 接管；
        # 首页 / 与已知资源仍正常命中。
        try_files $uri $uri/ =404;
    }
}
