server {
    listen __LIGHTOPS_PUBLIC_PORT__;
    listen [::]:__LIGHTOPS_PUBLIC_PORT__;
    server_name __LIGHTOPS_SERVER_NAME__;

    access_log /var/log/nginx/lightops_access.log;
    error_log /var/log/nginx/lightops_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /vendor/ {
        root /opt/lightops/app/static;
        expires 30d;
    }

    location = /index.html {
        root /opt/lightops/app/static;
        expires -1;
    }

    location ~ ^/(app\.js|render\.js|style\.css)$ {
        root /opt/lightops/app/static;
        expires -1;
    }

    location / {
        root /opt/lightops/app/static;
        try_files $uri $uri/ /index.html;
    }
}
